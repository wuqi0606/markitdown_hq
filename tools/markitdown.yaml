identity:
  name: markitdown
  author: lolit
  label:
    en_US: Convert to Markdown
    zh_Hans: 转换为 Markdown
  description:
    en_US: Convert PDF, Word, Excel, PPT and HTML into clean Markdown for Dify Knowledge Pipeline.
    zh_Hans: 将 PDF、Word、Excel、PPT 和 HTML 转换为干净 Markdown，供 Dify 知识管道使用。
  icon: icon.svg
description:
  human:
    en_US: Convert PDF, Word, PowerPoint, Excel, HTML and images into clean Markdown text. Preserves heading hierarchy and tables. Built for Dify Knowledge Pipeline document processing.
    zh_Hans: 将 PDF、Word、PPT、Excel、HTML 和图片转换为干净的 Markdown 文本，保留标题层级与表格结构，专为 Dify 知识管道文档处理设计。
  llm: Convert documents to Markdown. Use this in a Knowledge Pipeline to parse PDF/Word/Excel/PPT/HTML files before chunking.
parameters:
  - name: files
    type: files
    required: true
    label:
      en_US: Files
      zh_Hans: 文件
    human_description:
      en_US: Documents to convert (PDF, DOCX, PPTX, XLSX, HTML, images)
      zh_Hans: 待转换的文档（PDF、DOCX、PPTX、XLSX、HTML、图片）
    form: form
  - name: clean_noise
    type: boolean
    required: false
    default: true
    label:
      en_US: Clean conversion noise
      zh_Hans: 清除转换噪声
    human_description:
      en_US: Remove base64 image placeholders, empty table rows, and table-of-contents leftovers. Strongly recommended for knowledge base indexing.
      zh_Hans: 清除 base64 图片占位符、空表格行、目录残留。用于知识库索引时强烈建议开启。
    form: form
  - name: restore_headings
    type: boolean
    required: false
    default: true
    label:
      en_US: Restore heading levels
      zh_Hans: 补齐标题层级
    human_description:
      en_US: Detect chapter headings (一、/ （一）/ 1、) that Word stored as bold paragraphs instead of heading styles, and add # / ## / ### marks. Without this, parent-child chunking delimiters fail. Keep ON.
      zh_Hans: 识别 Word 中未套用标题样式、仅以加粗呈现的章节标题（一、/ （一）/ 1、），补上 # / ## / ### 标记。不开启则父子分段分隔符失效，建议保持开启。
    form: form
  - name: image_mode
    type: select
    required: false
    default: remove
    options:
      - value: remove
        label:
          en_US: Remove images
          zh_Hans: 删除图片
      - value: url
        label:
          en_US: Upload and link
          zh_Hans: 上传并替换为链接
      - value: describe
        label:
          en_US: Upload and describe
          zh_Hans: 上传并生成描述
    label:
      en_US: Image handling
      zh_Hans: 图片处理方式
    human_description:
      en_US: "remove: delete images. url: upload each image to Dify storage and replace with an accessible link (signed URL, may expire). describe: upload plus generate a Chinese description per image via the selected vision model, inserted before the link. Failed images are skipped individually."
      zh_Hans: "删除图片：从输出中移除图片引用。上传并替换为链接：每张内嵌图片上传到 Dify 存储，替换为可访问链接（签名 URL，有时效）。上传并生成描述：在上传基础上，用所选视觉模型为每张图生成中文描述，插在链接前。单张失败自动跳过，不影响其余图片。"
    form: form
  - name: model
    type: string
    required: false
    default: ''
    label:
      en_US: Vision model (provider/model)
      zh_Hans: 视觉模型（提供商/模型名）
    human_description:
      en_US: "Required when image handling is 'describe'. Format: provider-id/model-name, e.g. langgenius/volcengine_maas/doubao-seed-2-0-pro-260215. The provider id and model name are visible in Dify Settings -> Model Providers (hover/copy the model entry). Must be a vision-capable model."
      zh_Hans: "图片处理方式选「上传并生成描述」时必填。格式：提供商ID/模型名，例如 langgenius/volcengine_maas/doubao-seed-2-0-pro-260215。提供商 ID 和模型名可在 Dify「设置 → 模型供应商」里查看（把鼠标悬停在对应模型上可见完整标识）。必须是具备视觉能力的模型。"
    form: form
  - name: clean_pdf_headers
    type: boolean
    required: false
    default: true
    label:
      en_US: Clean PDF headers/footers
      zh_Hans: 清除 PDF 页眉页脚
    human_description:
      en_US: Remove repeating headers (company name), footers and page numbers that PDF text extraction mixes into the body. Only affects PDF files. Keep ON for PDF sources.
      zh_Hans: 清除 PDF 文本抽取时混入正文的重复页眉（公司名）、页脚与页码。仅对 PDF 生效，源文件为 PDF 时建议保持开启。
    form: form
  - name: pdf_header_keywords
    type: string
    required: false
    default: ''
    label:
      en_US: PDF header keywords
      zh_Hans: 页眉页脚特征词
    human_description:
      en_US: Keywords identifying repeating headers/footers, e.g. your company name. Separate multiple keywords with commas. Combined with built-in hints (confidentiality marks, document numbers). Leave empty if your PDFs have no custom headers.
      zh_Hans: 用于识别重复页眉/页脚的关键词，例如公司名称。多个词用逗号分隔。会与内置特征词（密级标识、文件编号、保密标识等）合并生效。PDF 无自定义页眉时留空即可。
    form: form
  - name: add_frontmatter
    type: boolean
    required: false
    default: false
    label:
      en_US: Add metadata frontmatter
      zh_Hans: 添加元数据前置信息
    human_description:
      en_US: Prepend a YAML frontmatter block with the source filename. Useful for traceability.
      zh_Hans: 在开头插入包含源文件名的 YAML frontmatter，便于溯源。
    form: form
extra:
  python:
    source: tools/markitdown.py
output_schema:
  type: string
  human_description:
    en_US: Converted Markdown text
    zh_Hans: 转换后的 Markdown 文本